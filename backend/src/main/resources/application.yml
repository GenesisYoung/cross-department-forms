server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: collab-dashboard
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:collab_dashboard}?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&serverTimezone=UTC
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:GenesisYoung@Mysql0904}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none # schema is owned by Flyway (db/migration)
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          batch_size: 200
        order_inserts: true
        order_updates: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  rabbitmq:
    host: ${RABBIT_HOST:localhost}
    port: ${RABBIT_PORT:5672}
    username: ${RABBIT_USER:guest}
    password: ${RABBIT_PASSWORD:guest}
    listener:
      simple:
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

collab:
  jwt:
    # Override in production with a random 256-bit+ secret (base64).
    secret: ${JWT_SECRET:Y29sbGFiLWRhc2hib2FyZC1kZXYtc2VjcmV0LWNoYW5nZS1tZS1pbi1wcm9kdWN0aW9uLTEyMzQ1Njc4OTA=}
    ttl-hours: ${JWT_TTL_HOURS:12}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173}
  seed:
    # Seeds departments, demo users, templates and sample sheets on an empty database.
    enabled: ${SEED_DEMO_DATA:true}
  sheet:
    max-rows: 5000
    max-cols: 200
